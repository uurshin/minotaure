tab_label_challenge: Możesz uruchomić odpowiednik rzutów kostką, które spowodują dla każdej postaci objętej wyzwaniem konsekwencje w zależności od jej sukcesu lub porażki.
tab_label_characters: 'To jest karta, którą najczęściej pokazujesz podczas gry: przedstawia wszystkie stworzone postacie i podsumowuje ich właściwości (imię postaci, pseudonim gracza, jauges, cechy, tagi, itp.). Możesz w niej szukać postaci według wielu kryteriów.'
tab_label_pick: Losowania pozwalają ci losowo wybrać określoną liczbę postaci według własnego wyboru spośród całej populacji lub jej części. Możesz także nałożyć konsekwencje na wylosowane postacie.
