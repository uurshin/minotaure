summary_target_count: also 1 Charakter | also {count} Charaktere
tab_label_challenge: Sie können das Äquivalent von Würfelwürfen auslösen, die für jeden betroffenen Charakter Konsequenzen je nach Erfolg oder Misserfolg haben.
tab_label_characters: 'Dies ist der Tab, den Sie während des Spiels am häufigsten zeigen werden: Er zeigt alle erstellten Charaktere an und fasst deren Eigenschaften zusammen (Charaktername, Spielername, Anzeigen, Attribute, Tags, etc.). Sie können Charaktere nach vielen Kriterien suchen.'
tab_label_pick: Die Auswahlen ermöglichen es Ihnen, eine beliebige Anzahl von Charakteren Ihrer Wahl zufällig aus der gesamten oder einem Teil der Bevölkerung auszuwählen. Sie können auch Konsequenzen für die ausgewählten Charaktere anwenden.
tab_label_poll: Sie können eine Umfrage starten, um herauszufinden, in welche Richtung das Spiel gehen soll. Sie können auch Tags zu den Charakteren basierend auf den Entscheidungen der Spieler in der Umfrage hinzufügen.
tab_label_settings: Die Einstellungen sind die Spielparameter, die wir empfehlen, vor dem Start zu ändern, aber Sie können sie während des Spiels jederzeit ändern.
tab_label_tags: Tags sind Etiketten, die Charakteren zugeordnet sind und die die große Stärke von Minotaure ausmachen.<br>
