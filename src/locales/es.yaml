success_threshold: Umbral de éxito del grupo
summary_target_count: es decir, 1 personaje | es decir, {count} personajes
tab_label_challenge: Puedes iniciar el equivalente a lanzamientos de dados que generarán consecuencias para cada personaje involucrado según su éxito o fracaso.
tab_label_characters: 'Esta es la pestaña que mostrarás más a menudo durante el juego: presenta todos los personajes creados y resume sus propiedades (nombre del personaje, seudónimo del jugador, barras, características, etiquetas, etc.). Puedes buscar personajes según muchos criterios.'
tab_label_pick: Los sorteos te permiten seleccionar al azar un número de personajes de tu elección entre toda o parte de la población. También puedes aplicar consecuencias a los personajes seleccionados al azar.
tab_label_poll: Puedes iniciar una encuesta que te permitirá saber en qué dirección llevar la partida. También puedes agregar etiquetas a los personajes según las elecciones de cada jugador en la encuesta.
tab_label_settings: Los ajustes son la configuración de la partida que te recomendamos modificar antes de iniciarla, pero que siempre podrás cambiar durante la partida.
tab_label_tags: Las etiquetas son etiquetas asignadas a los personajes y son la gran fuerza de Minotauro.<br>
