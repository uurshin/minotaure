submit_your_char: Enviar seu personagem
success_threshold: Limiar de sucesso do grupo
tab_label_challenge: Você pode acionar o equivalente a rolagens de dados que resultarão em consequências para cada personagem envolvido, dependendo de seu sucesso ou fracasso.
tab_label_characters: 'Esta é a aba que você mais usará durante o jogo: apresenta todos os personagens criados e resume suas propriedades (nome do personagem, pseudônimo do jogador, barras, estatísticas, tags, etc.). Você pode procurar personagens com base em vários critérios.'
tab_label_pick: Sorteios aleatórios permitem que você selecione um número de personagens de sua escolha aleatoriamente de toda a população ou de uma parte dela. Você também pode aplicar consequências aos personagens sorteados.
tab_label_poll: Você pode acionar uma enquete que ajudará a determinar a direção em que o jogo deve evoluir. Você também pode adicionar tags aos personagens com base nas escolhas de cada jogador na enquete.
tab_label_settings: As configurações são as configurações do jogo que recomendamos que você mude antes que o jogo comece, mas que você pode sempre alterar durante o jogo.
tab_label_tags: As tags são rótulos atribuídos aos personagens e são uma grande força do Minotaure.<br>
