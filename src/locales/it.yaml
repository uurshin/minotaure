step_game_name: Puoi cambiare il nome del gioco in qualsiasi momento.
step_help: Vuoi fare l'intero tour o hai bisogno di aiuto solo per questa scheda?
step_invite: Cliccando su questo pulsante verrà copiato un link di invito che ti permetterà di invitare persone a unirsi al tuo gioco.
step_settings_add_gauge: Puoi aggiungere quante barre desideri.
step_settings_add_stat: Puoi aggiungere quante statistiche desideri.
step_settings_challenge_timer: Imposta il tempo concesso ai giocatori per fare scelte e lanciare il loro dado dopo l'inizio di una sfida.
step_settings_disconnected_prevent: Puoi scegliere che i personaggi disconnessi non siano mai presi in considerazione durante le sfide e i sorteggi che lanci.
step_settings_gauge: Tutti i personaggi hanno queste barre quando vengono creati, con un numero di punti iniziali che puoi cambiare.
step_settings_gauge_cancel: Non è obbligatorio confermare le modifiche, puoi confermare o annullare tutte le modifiche.
step_settings_gauge_delete: Puoi eliminare una barra in qualsiasi momento.
step_settings_gauge_make_deadly: Puoi fare in modo che il passaggio di una barra a un punteggio di 0 comporti la morte di un personaggio cliccando su questo pulsante (questa azione è reversibile, ma i personaggi già morti non verranno resuscitati!).
step_settings_gauge_max: Puoi specificare un massimo opzionale che i personaggi non possono superare per questa barra.
step_settings_gauge_name: È possibile modificare il nome di una barra in qualsiasi momento.
step_settings_gauge_spending: Seleziona la casella per le caratteristiche per le quali desideri consentire ai giocatori di spendere i punti scala per ridurre la difficoltà delle sfide corrispondenti (puoi quindi scegliere il valore di riduzione della difficoltà per punto speso).
step_settings_gauge_value: Questo numero determina il valore di base di una barra per un personaggio al momento della creazione.
step_settings_gauges: 'Le barre sono riserve di punti per ogni personaggio. Quando crei un gioco, vengono create di default due barre: vita e volontà.'
step_settings_markers: I marcatori sono contatori globali per il gioco. Il loro valore può essere modificato da questa schermata, ma anche aumentato o diminuito automaticamente in seguito a un successo o a un fallimento del gruppo durante una sfida.
step_settings_npc_prevent: Puoi anche scegliere che i personaggi non giocanti (che puoi creare nella scheda Personaggi) non siano mai presi in considerazione durante le sfide e i sorteggi che lanci.
step_settings_settings: Puoi regolare alcune impostazioni del gioco.
step_settings_stat: Tutti i personaggi hanno queste statistiche alla loro creazione, con un numero di punti iniziali di 10 + un numero casuale compreso tra -9 e +9. <br> Il totale dei punti di tutte le statistiche alla creazione di un personaggio è sempre 10 volte il numero di statistiche, per garantire lo stesso totale di punti per tutti i partecipanti.
step_settings_stat_delete: Puoi eliminare una statistica in qualsiasi momento.
step_settings_stats: 'Le statistiche funzionano allo stesso modo di molti giochi di ruolo. Quando crei un gioco, vengono create due statistiche: fisica e mentale.'
step_settings_stats_max: Puoi impostare un valore massimo per una caratteristica durante la creazione di un personaggio. Questo valore massimo può essere superato a seconda dei bonus assegnati ai tag di un personaggio.
step_start: Finché non clicchi su questo pulsante, i tuoi ospiti saranno in attesa su una schermata di attesa.
step_tags: Ogni tag appartiene a un gruppo di tag, che può essere nominato (ad esempio, professioni, genere, razza, vantaggi, difetti, ecc.). Un tag può essere usato per una classe di personaggi, ma è versatile abbastanza per altri utilizzi.
step_tags_group: Inizia a digitare il testo e conferma per creare un tag. A esso verrà associato un colore.
step_tags_group_add: Puoi aggiungere quante gruppi di tag desideri.
step_tags_group_delete: Puoi eliminare un gruppo di tag in qualsiasi momento. Ciò rimuoverà i tag corrispondenti dai personaggi.
step_tags_group_distribute: Fai clic qui per distribuire un tag da questo gruppo a tutti i personaggi che non ne hanno già uno. Utile se hai creato il gruppo durante il gioco.
step_tags_group_distribution: 'Per ogni gruppo di tag, puoi scegliere una modalità di distribuzione dei tag: <ul> <li>- scelto dal giocatore alla creazione del personaggio</li> <li>- assegnato casualmente</li> <li>- distribuito equamente (il sistema sceglierà tra i tag meno assegnati per bilanciare quelli distribuiti)</li> <li>- non assegnato alla creazione (li userai diversamente che alla creazione del personaggio)</li> </ul>'
step_tags_group_rename: Puoi rinominare un gruppo di tag in qualsiasi momento.
step_tags_group_shuffle: Fai clic qui per distribuire un tag da questo gruppo a tutti i personaggi che ne hanno già uno. Il nuovo tag sostituirà il vecchio. Utile se non sei soddisfatto della distribuzione attuale.
step_tags_tag: 'Ogni tag può influenzare le barre e le statistiche di un personaggio alla sua creazione. Cliccando su un tag, puoi: <ul> <li>- associarlo a una <strong>statistica principale</strong>. Se un personaggio ottiene questo tag alla creazione, sarà automaticamente la loro statistica più forte. Ad esempio, un tag "mago" potrebbe avere la statistica principale "Magia".</li> <li>- associarlo a una <strong>statistica secondaria</strong>. Se un personaggio ottiene questo tag alla creazione, sarà automaticamente la loro seconda statistica più forte.</li> <li>- associarlo a <strong>bonus</strong> e <strong>penalità</strong> che modificano il tiro iniziale delle statistiche o il valore iniziale di alcune barre.</li> <li>- aumentare o diminuire la <strong>probabilità</strong> di assegnazione casuale.</li> <li>- cambiare il suo <strong>colore</strong>.</li> </ul>'
step_tags_tag_rename: Puoi rinominare un tag in qualsiasi momento cliccando sul suo nome
