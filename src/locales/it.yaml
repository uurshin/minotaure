summary_target_count: ovvero 1 personaggio | ovvero {count} personaggi
tab_label_challenge: Puoi avviare l'equivalente di tiri di dado che avranno conseguenze per ogni personaggio coinvolto, a seconda del loro successo o fallimento.
tab_label_characters: 'Questa è la scheda che userai di più durante il gioco: presenta tutti i personaggi creati e ne riassume le proprietà (nome del personaggio, pseudonimo del giocatore, pipistrelli, statistiche, tag, ecc.). Puoi cercare personaggi in base a vari criteri.'
tab_label_pick: Le pesche casuali ti consentono di selezionare un numero di personaggi a tua scelta a caso da tutta la popolazione o da una porzione di essa. Puoi anche applicare conseguenze ai personaggi pescati.
tab_label_poll: Puoi avviare un sondaggio che ti aiuterà a determinare la direzione in cui il gioco dovrebbe evolvere. Puoi anche aggiungere tag ai personaggi in base alle scelte di ciascun giocatore nel sondaggio.
tab_label_settings: Le impostazioni sono le impostazioni del gioco che ti consigliamo di modificare prima che il gioco inizi, ma che puoi sempre cambiare durante il gioco.
tab_label_tags: I tag sono etichette assegnate ai personaggi e sono una grande forza di Minotaure.<br>
